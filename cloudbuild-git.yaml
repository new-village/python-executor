steps:
  # 1. Clone the repository into /workspace directly
  - id: 'clone-repo'
    name: 'gcr.io/cloud-builders/git'
    args:
      - 'clone'
      - 'https://github.com/new-village/python-executor.git'
      - '.'

  # 2. Build the container image
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '.'

  # 3. Push all tags
  - id: 'push-images'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '-a'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}'

  # 4. Deploy/update Cloud Run Job
  - id: 'deploy-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_JOB_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

substitutions:
  _REGION: 'asia-northeast1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _IMAGE_NAME: 'python-executor'
  _JOB_NAME: 'python-executor-job'

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: 'projects/yata-intelligence/serviceAccounts/openclaw-sa@yata-intelligence.iam.gserviceaccount.com'
