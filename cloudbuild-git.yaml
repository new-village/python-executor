steps:
  # 1. Clone the repository into /workspace directly
  - id: 'clone-repo'
    name: 'gcr.io/cloud-builders/git'
    args:
      - 'clone'
      - 'https://github.com/new-village/python-executor.git'
      - '.'

  # 2. Configure docker auth for Artifact Registry
  - id: 'auth-docker'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'auth'
      - 'configure-docker'
      - '${_REGION}-docker.pkg.dev'
      - '--quiet'

  # 3. Build the container image
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '.'

  # 3. Push image (commit SHA tag)
  - id: 'push-sha'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'

  # 3b. Push image (latest tag)
  - id: 'push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

  # 4. Update Cloud Run Job image
  - id: 'update-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_JOB_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

substitutions:
  _REGION: 'asia-northeast1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _IMAGE_NAME: 'python-executor'
  _JOB_NAME: 'build-name-mapping-job'

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: 'projects/yata-intelligence/serviceAccounts/openclaw-sa@yata-intelligence.iam.gserviceaccount.com'
